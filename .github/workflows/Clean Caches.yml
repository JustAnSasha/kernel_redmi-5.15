name: Clean Caches

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ccache entries
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const caches = await github.rest.actions.getActionsCacheList({ owner, repo, per_page: 100 });
            let deleted = 0;
            for (const cache of caches.data.actions_caches) {
              if (cache.key.startsWith('ccache-')) {
                await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
                deleted++;
              }
            }
            return `deleted ${deleted} caches`;
