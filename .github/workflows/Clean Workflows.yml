name: Clean Workflows

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        type: choice
        description: Workflow to clean
        required: true
        default: Build Kernel
        options:
          - Build Kernel
          - Clean Caches
          - Clean Workflows
      count:
        description: Maximum runs to delete
        required: false
        default: "20"
      delete_failed:
        description: Delete failed runs
        required: false
        type: boolean
        default: true
      delete_success:
        description: Delete successful runs
        required: false
        type: boolean
        default: false
      delete_cancelled:
        description: Delete cancelled runs
        required: false
        type: boolean
        default: true

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        env:
          REPO: ${{ github.repository }}
          COUNT: ${{ inputs.count }}
          DELETE_FAILED: ${{ inputs.delete_failed }}
          DELETE_SUCCESS: ${{ inputs.delete_success }}
          DELETE_CANCELLED: ${{ inputs.delete_cancelled }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: |
          set -e
          WORKFLOW_ID=$(gh api "repos/$REPO/actions/workflows" | jq -r ".workflows[] | select(.name == \"$WORKFLOW_NAME\") | .id")
          if [ -z "$WORKFLOW_ID" ]; then
            echo "workflow \"$WORKFLOW_NAME\" not found"
            exit 1
          fi
          PAGE=1
          DELETED=0
          while [ "$DELETED" -lt "$COUNT" ]; do
            RUNS=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100&page=$PAGE" | jq -c '.workflow_runs[]')
            if [ -z "$RUNS" ]; then
              break
            fi
            while read -r run; do
              ID=$(echo "$run" | jq -r '.id')
              STATE=$(echo "$run" | jq -r '.status')
              STATUS=$(echo "$run" | jq -r '.conclusion')
              if [ "$STATE" = "in_progress" ] || [ "$STATE" = "queued" ]; then
                continue
              fi
              if [ "$STATUS" = "failure" ] && [ "$DELETE_FAILED" != "true" ]; then continue; fi
              if [ "$STATUS" = "success" ] && [ "$DELETE_SUCCESS" != "true" ]; then continue; fi
              if [ "$STATUS" = "cancelled" ] && [ "$DELETE_CANCELLED" != "true" ]; then continue; fi
              gh api -X DELETE "repos/$REPO/actions/runs/$ID" || true
              DELETED=$((DELETED + 1))
              if [ "$DELETED" -ge "$COUNT" ]; then
                break
              fi
            done <<< "$RUNS"
            PAGE=$((PAGE + 1))
          done
          echo "deleted $DELETED runs"
