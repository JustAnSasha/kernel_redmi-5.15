name: Clean Workflows

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error::PAT_TOKEN secret is not set"
            exit 1
          fi
          gh run list --limit 1000 --json databaseId --jq '.[].databaseId' | tail -n +11 | while read -r id; do
            gh run delete "$id" || true
          done
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
