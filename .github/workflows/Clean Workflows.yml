name: Clean Workflows

on:
  workflow_dispatch:
    inputs:
      keep:
        description: Number of latest runs to keep
        required: false
        type: number
        default: 10

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error::PAT_TOKEN secret is not set"
            exit 1
          fi
          gh run list --limit 1000 --json databaseId --jq '.[].databaseId' | tail -n +$(( ${{ inputs.keep }} + 1 )) | while read -r id; do
            gh run delete "$id" || true
          done
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
