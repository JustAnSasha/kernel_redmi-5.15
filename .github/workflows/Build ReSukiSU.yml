          KPM_TEXT="${{ github.event.inputs.KPM == 'on' && 'Enabled' || 'Disabled' }}"
          DROID_TEXT="${{ github.event.inputs.droidspaces == 'on' && 'Enabled' || 'Disabled' }}"
          SPOOF_TEXT="${{ github.event.inputs.spoofIntegrity == 'on' && 'Enabled' || 'Disabled' }}"

          CAPTION="❌ <b>Kernel Build Failed</b>

