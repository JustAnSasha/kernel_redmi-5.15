name: "Build kernels (NoKSU, SukiSU, etc.)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/ShiningAsStar/kernel_redmi-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: true
        type: choice
        default: "shining"
        options:
          - "google"
          - "shining"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      kernelSpoofVersion:
        description: "Spoof kernel version (format: X.Y.Z)"
        required: false
        type: string
        default: "6.1.100"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: "-Shiney"
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "ksu"
        options:
          - "noksu"
          - "ksu"
          - "both"
      ksuVariant:
        description: "KSU implementation (if KSU enabled)"
        required: true
        type: choice
        default: "sukisu-ultra"
        options:
          - "kernelsu"
          - "sukisu-ultra"
          - "resukisu"
          - "wild-ksu"
          - "kowsu"
          - "mambosu"
      optimizationLevel:
        description: "Compiler optimization level"
        required: false
        type: choice
        default: "O3"
        options:
          - "O2"
          - "O3"
          - "Os"
      tickRate:
        description: "Kernel tick rate (Hz)"
        required: false
        type: choice
        default: "300"
        options:
          - "default"
          - "100"
          - "250"
          - "300"
          - "500"
          - "600"
          - "750"
          - "1000"
      bbg:
        description: "Baseband-guard Support (if KSU Enabled)"
        required: true
        type: choice
        default: "on"
        options:
          - "on"
          - "off"
      LtoOptimizations:
        description: "Choose LTO"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"
      useSUSFS:
        description: "Enable SUSFS integration with KSU?"
        required: true
        type: choice
        default: "off"
        options:
          - "on"
          - "off"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}

    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 🔍 Check Space (Before Cleanup)
        run: |
          echo "Disk space before cleanup:"
          df -h /

      - name: 🧹 Aggressive Cleanup
        run: |
          # Remove heavy pre-installed tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Prune Docker to remove hidden images and build cache
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: 🔍 Check Space (After Cleanup)
        run: |
          echo "Disk space after cleanup:"
          df -h /

      - name: 📐 Setup SWAP for runners
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 20

      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=60" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p
      
      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "🧬 Safe Kernel Version Spoof"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "🔧 Starting dynamic kernel version spoof..."
          
          SPOOF_VERSION="${{ github.event.inputs.kernelSpoofVersion }}"
          LOCAL_VERSION="${{ github.event.inputs.localVersion }}"
          FULL_VERSION="${SPOOF_VERSION}${LOCAL_VERSION}"
          
          if [ -z "$SPOOF_VERSION" ]; then
            echo "⚠️ No spoof version provided. Using default source version."
          else
            echo "➡️ Target Full Version: $FULL_VERSION"

            # 1. Hardcode KERNELVERSION including the local suffix
            sed -i "s/^KERNELVERSION =.*/KERNELVERSION = $FULL_VERSION/" Makefile
            
            # 2. Silence the setlocalversion script
            echo "" > .scmversion
            sed -i 's/echo "\$res"/#echo "\$res"/g' scripts/setlocalversion
            
            # 3. Force configuration overrides in defconfig
            CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
            sed -i '/CONFIG_LOCALVERSION/d' "$CONFIG_FILE"
            sed -i '/CONFIG_LOCALVERSION_AUTO/d' "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION=\"$LOCAL_VERSION\"" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

            # 4. Update build constants for GKI
            if [ -f "build.config.constants" ]; then
                sed -i "s/^KERNEL_VERSION=.*/KERNEL_VERSION=$FULL_VERSION/" build.config.constants
            fi

            echo "✅ Spoof applied successfully. Final name: $FULL_VERSION"
          fi
          
      - name: "📥 Initialize repo"
        working-directory: ${{ env.WORK_DIR}}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
          
          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r584948.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r584948.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r584948
          tar -xzf prebuilts/clang/host/linux-x86/clang-r584948.tar.gz -C prebuilts/clang/host/linux-x86/clang-r584948
          rm -rf prebuilts/clang/host/linux-x86/clang-r584948.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r584948/' \
           ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants
          
          sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

          sed -i \
           -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
           -e '/^TRIM_NONLISTED_KMI=/d' \
           -e '/^KMI_ENFORCED=/d' \
           -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
           -e '$a\TRIM_NONLISTED_KMI=0' \
           -e '$a\KMI_ENFORCED=0' \
           -e '/^MODULES_ORDER=/d' \
           -e '/^MODULES_LIST=/d' \
           ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64

      - name: "⚙️ Configure kernel optimization and tick rate"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}";
          
          # Helper with proper error handling
          apply_patch() {
            local url="$1";
            local file=$(basename "$url")
            if ! curl -L -f -o "$file" "$url"; then
              echo "::error::Failed to download patch from $url"
              return 1
            fi
            # Check if it's a valid patch
            if ! head -1 "$file" | grep -q "^---"; then
              echo "::error::Invalid patch format from $url"
              cat "$file"
              return 1
            fi
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file (continuing)"
            rm -f "$file"
          }

          # custom tickrate options patch (may fail, but we continue)
          apply_patch "https://raw.githubusercontent.com/ShiningAsStar/extra_stuff/main/custom-tickrate-options.patch" || true
          
          # Remove any .rej files left by failed patches
          find . -name "*.rej" -delete
          
          # Remove existing optimization configs
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' "$CONFIG_FILE"
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3/d' "$CONFIG_FILE"
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_SIZE/d' "$CONFIG_FILE"
          
          # Apply selected optimization level
          case "${{ github.event.inputs.optimizationLevel }}" in
            O2)
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            O3)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            Os)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$CONFIG_FILE"
              ;;
          esac
         
          # Apply selected tick rate
          case "${{ github.event.inputs.tickRate }}" in
          default)
              echo Nothing to change. Keep Default.
              ;;
            100)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=100" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_100=y" >> "$CONFIG_FILE"
              ;;
            250)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=250" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_250=y" >> "$CONFIG_FILE"
              ;;
            300)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=300" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_300=y" >> "$CONFIG_FILE"
              ;;
            500)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=500" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_500=y" >> "$CONFIG_FILE"
              ;;
            600)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=600" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_600=y" >> "$CONFIG_FILE"
              ;;
            750)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=750" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_750=y" >> "$CONFIG_FILE"
              ;;
            1000)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=1000" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_1000=y" >> "$CONFIG_FILE"
              ;;
          esac

          # Remove any existing LTO FULL configuration
          sed -i '/^CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
    
          # LTO Configuration - Enable Thin LTO only
          if [ "${{ github.event.inputs.LtoOptimizations }}" = "thin" ]; then
           sed -i '/CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG=y" >> "$CONFIG_FILE"
           echo "# CONFIG_LTO_CLANG_FULL is not set" >> "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG_FILE"
           echo "CONFIG_THINLTO=y" >> "$CONFIG_FILE"
          else
           sed -i '/CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG=y" >> "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG_FILE"
           echo "# CONFIG_LTO_CLANG_THIN is not set" >> "$CONFIG_FILE"
           echo "# CONFIG_THINLTO is not set" >> "$CONFIG_FILE"
          fi

          # Set localversion
          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"
          fi

          # Basic optimizations
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"

          # Extra TCP configs
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          EOF

          # Script sign patch
          apply_patch "https://raw.githubusercontent.com/ShiningAsStar/kernel_patches/main/0001-scripts-sign-builds.patch" || true

          echo "✅ Applied -${{ github.event.inputs.optimizationLevel }} Optimization"
          echo "✅ Applied ${{ github.event.inputs.tickRate }}Hz tick rate"

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.variant == 'ksu' && github.event.inputs.bbg == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "Adding BBG...";
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        
      - name: "🔧 Setup KernelSU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'kernelsu' && github.event.inputs.useSUSFS == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "📦 Adding SUSFS integration to KernelSU..."
          
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          echo "🔧 Applying SUSFS kernel patch...";
          if patch -p1 < "$SUSFS_KERNEL_PATCH" 2>&1 | grep -q "can't find file"; then
            echo "⚠️ Patch file not found, trying with --forward"
            patch -p1 --forward < "$SUSFS_KERNEL_PATCH" || echo "⚠️ Patch had issues but continuing"
          elif patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch hunks failed but continuing"
          fi

          echo "📄 Forcing SUSFS source files..."
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            if ! grep -q "#include <linux/cred.h>" include/linux/susfs_def.h; then
              sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
            fi
          fi

          echo "📦 Integrating SUSFS with KernelSU..."
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/
          fi

          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            cd KernelSU
            if patch -p1 --forward < ../$KSU_PATCH; then
              echo "✔ Applied KSU SUSFS patch"
            else
              echo "⚠️ KSU patch already applied or failed"
            fi
            cd ..
          fi

          rm -rf susfs4ksu

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'SUSFSCONFIG'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          SUSFSCONFIG

          echo "✅ KernelSU with SUSFS configured"

      - name: "🔧 Setup SukiSU-Ultra with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'sukisu-ultra' && github.event.inputs.useSUSFS == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "📦 Adding SUSFS to SukiSU-Ultra..."
          
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          echo "🔧 Applying SUSFS kernel patch..."
          if patch -p1 --forward < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch applied"
          else
            echo "⚠️ Patch had issues but continuing"
          fi

          echo "📄 Forcing SUSFS source injection..."
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            if ! grep -q "#include <linux/cred.h>" include/linux/susfs_def.h; then
              sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
            fi
          fi

          echo "📦 Injecting SUSFS into KernelSU..."
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/
          fi

          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if grep -q "susfs_init" KernelSU/kernel/ksu.c 2>/dev/null; then
            echo "✔ SUSFS already integrated"
          elif [ -f "$KSU_PATCH" ]; then
            cd KernelSU
            if patch -p1 --forward < ../$KSU_PATCH; then
              echo "✔ Applied KSU SUSFS patch"
            fi
            cd ..
          fi

          rm -rf susfs4ksu
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'SUSFSCONFIG'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          SUSFSCONFIG
          
          echo "✅ SukiSU-Ultra with SUSFS configured"

      - name: "🔧 Setup RESUKISU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'resukisu' && github.event.inputs.useSUSFS == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e

          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "📄 Installing SUSFS source files..."
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            if ! grep -q "#include <linux/cred.h>" include/linux/susfs_def.h; then
              sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
            fi
          fi

          SUSFS_KERNEL_PATCH="$(pwd)/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          echo "🔧 Applying SUSFS KERNEL PATCH..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch applied"
          else
            echo "⚠️ SUSFS patch had issues but continuing"
          fi

          # ✅ SAFE INJECTION: add include after last existing include in task_mmu.c
          if ! grep -q "linux/susfs.h" fs/proc/task_mmu.c; then
            echo "🔧 Adding SUSFS include to task_mmu.c"
            # Find the last #include line and append our include after it
            sed -i '/^#include/ { h; d; }; $G; s/\(.*\)/#include <linux\/susfs.h>\n\1/' fs/proc/task_mmu.c
          fi

          echo "📦 Applying hide_stuff patch"
          curl -LSs "https://raw.githubusercontent.com/nebixts/kernel_patches/main/69_hide_stuff.patch" | patch -p1 -F 3 || echo "⚠️ Hide stuff patch skipped"

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "📝 Configuring RESUKISU with SUSFS..."
          cat >> "$CONFIG_FILE" << 'SUSFSCONFIG'
          CONFIG_KSU=y
          CONFIG_KPM=n
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          SUSFSCONFIG

          rm -rf ./susfs4ksu

          echo "✅ RESUKISU with SUSFS configured"

      - name: "🔧 Setup Wild-KSU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'wild-ksu' && github.event.inputs.useSUSFS == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
          
          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          echo "🔧 Applying SUSFS kernel patch..."
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          if [ -f "$SUSFS_PATCH" ]; then
            if patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "✅ SUSFS kernel patch applied"
            else
              echo "⚠️ Patch had issues but continuing"
            fi
          fi
          
          echo "📄 Installing SUSFS source files..."
          mkdir -p fs include/linux
          
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            if ! grep -q "#include <linux/cred.h>" include/linux/susfs_def.h; then
              sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
            fi
          fi
          
          echo "📦 Integrating SUSFS with Wild-KSU..."
          
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
          fi
          
          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          
          if grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            echo "✔ SUSFS already integrated"
          elif [ -f "$KSU_PATCH" ]; then
            cd Wild_KSU
            if patch -p1 --forward < ../$KSU_PATCH; then
              echo "✔ Applied KSU SUSFS patch"
            fi
            cd ..
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'SUSFSCONFIG'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          SUSFSCONFIG
          
          rm -rf ./susfs4ksu
          echo "🎉 Wild KSU with SUSFS configured!"

      - name: "🔧 Setup KowSU"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'kowsu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu
          
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s master
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          
          echo "✅ Installed KowSU"

      - name: "🔧 Setup MamboSU"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'mambosu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu
          
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          
          echo "✅ Installed MamboSU"
      
      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          export KBUILD_BUILD_USER=ShiningAsStar
          export KBUILD_BUILD_HOST=GitHub
          echo "🚀 Starting kernel compilation..."
          
          export KERNEL_VERSION="${{ github.event.inputs.kernelSpoofVersion }}${{ github.event.inputs.localVersion }}"
          
          # 🔧 Disable unused-variable and unused-label errors (fixes SUSFS related warnings)
          export KCFLAGS="-Wno-error=unused-variable -Wno-error=unused-label"
          
          if [ "${{ github.event.inputs.LtoOptimizations }}" = "thin" ]; then
            echo "Using Thin LTO optimization"
            LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          else
            echo "Using Full LTO optimization"
            LTO=full BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          fi
            
      - name: "🩹 Apply KPM patch (SukiSU-Ultra only)"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'sukisu-ultra'
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch
          chmod +x patch
          ./patch
          mv oImage Image

      - name: "📦 Prepare artifact"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          VARIANT_NAME="${{ matrix.variant }}";
          if [ "${{ matrix.variant }}" == "ksu" ]; then
            VARIANT_NAME="${{ matrix.variant }}";
          fi
          cp out/dist/Image Image.$VARIANT_NAME
          echo "ARTIFACT_NAME=kernel-${VARIANT_NAME}-${{ github.event.inputs.optimizationLevel }}-${{ github.event.inputs.tickRate }}hz" >> $GITHUB_ENV
          echo "IMAGE_NAME=Image.$VARIANT_NAME" >> $GITHUB_ENV

      - name: 🔍 Check Space (Post-Build)
        if: always()
        run: |
          echo "Final disk space status:"
          df -h /

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORK_DIR }}/${{ env.IMAGE_NAME }}
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d')
          git clone --depth=1 https://github.com/ShiningAsStar/AnyKernel3 -b master AnyKernel3
          
          find kernels -name "Image.*" -exec cp {} AnyKernel3/ \;
          
          KSU_INFO=""
          if [ "${{ github.event.inputs.buildKSU }}" != "noksu" ]; then
            KSU_INFO="_${{ github.event.inputs.ksuVariant }}"
          fi
          ZIP_NAME="Anykernel3_${{ github.event.inputs.kernelBranch }}${KSU_INFO}_${{ github.event.inputs.optimizationLevel }}_${{ github.event.inputs.tickRate }}hz_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: "📱 Send to Telegram"
        if: always()
        run: |
         if [[ -f "${{ env.ZIP_PATH }}" ]]; then
          KSU_TEXT=""
         if [ "${{ github.event.inputs.buildKSU }}" != "noksu" ]; then
          KSU_TEXT="
         🔐 *KSU Variant:* \`${{ github.event.inputs.ksuVariant }}\`"
         fi
      
         CAPTION="✅ *Kernel Build Successful*

         📦 *Build Information:*
         • Kernel: \`Linux ${{ env.KERNEL_VERSION }}\`
         • Android: \`13-16\`
         • Branch: \`${{ github.event.inputs.kernelBranch }}\`
         • Device: \`${{ github.event.inputs.kernelDevice }}\`

         ⚙️ *Configuration:*
         • Optimization: \`-${{ github.event.inputs.optimizationLevel }}\`
         • Tick Rate: \`${{ github.event.inputs.tickRate }}Hz\`
         • Build Type: \`${{ github.event.inputs.buildKSU }}\`${KSU_TEXT}
         • SUSFS: \`${{ github.event.inputs.useSUSFS }}\`
         • Local Version: \`${{ github.event.inputs.localVersion }}\`

         🕐 *Build Date:* $(date '+%Y-%m-%d %H:%M:%S UTC')
         📦 *Package:* \`${{ env.ZIP_NAME }}\`"

         curl -s -F document=@"${{ env.ZIP_PATH }}" \
           -F caption="$CAPTION" \
           -F parse_mode="Markdown" \
           -F chat_id=${{ secrets.TELEGRAM_USER_ID }} \
           "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
         else
         FAILURE_MSG="❌ *Kernel Build Failed*

         📦 *Build Information:*
         • Kernel: \`Linux ${{ env.KERNEL_VERSION }}\`
         • Android: \`13-16\`
         • Branch: \`${{ github.event.inputs.kernelBranch }}\`
         • Device: \`Redmi Note 12/13 4G. Pad SE\`

         ⚙️ *Configuration:*
         • Optimization: \`-${{ github.event.inputs.optimizationLevel }}\`
         • Tick Rate: \`${{ github.event.inputs.tickRate }}Hz\`
         • Build Type: \`${{ github.event.inputs.buildKSU }}\`
         • Local Version: \`${{ github.event.inputs.localVersion }}\`

         🕐 *Failed at:* $(date '+%Y-%m-%d %H:%M:%S UTC')

         🔍 Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."

         curl -s -X POST \
           -d chat_id=${{ secrets.TELEGRAM_USER_ID }} \
           -d text="$FAILURE_MSG" \
           -d parse_mode="Markdown" \
           "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
         fi
