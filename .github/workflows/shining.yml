      - name: "🔧 Setup RESUKISU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'resukisu' && github.event.inputs.useSUSFS == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
