name: "Build kernels (NoKSU, SukiSU, RESukisu and NEXT.)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/ShiningAsStar/kernel_redmi-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: true
        type: choice
        default: "shining"
        options:
          - "google"
          - "shining"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      kernelSpoofVersion:
        description: "Spoof kernel version (format: X.Y.Z)"
        required: false
        type: string
        default: "6.1.100"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: "-Shiney"
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "ksu"
        options:
          - "noksu"
          - "ksu"
          - "both"
      ksuVariant:
        description: "KSU implementation (if KSU enabled)"
        required: true
        type: choice
        default: "sukisu-ultra"
        options:
          - "kernelsu"
          - "sukisu-ultra"
          - "resukisu"
          - "next"
      optimizationLevel:
        description: "Compiler optimization level"
        required: false
        type: choice
        default: "O3"
        options:
          - "O2"
          - "O3"
          - "Os"
      tickRate:
        description: "Kernel tick rate (Hz)"
        required: false
        type: choice
        default: "300"
        options:
          - "default"
          - "100"
          - "250"
          - "300"
          - "500"
          - "600"
          - "750"
          - "1000"
      bbg:
        description: "Baseband-guard Support (if KSU Enabled)"
        required: true
        type: choice
        default: "on"
        options:
          - "on"
          - "off"
      LtoOptimizations:
        description: "Choose LTO"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"
      KPM:
        description: "Kernel Patch Image for SukiSU/ReSukiSU (if KSU enabled)"
        required: true
        type: choice
        default: "off"
        options:
          - "on"
          - "off"
      swapSizeGB:
        description: "Extra swapfile size in GB (0 disables)"
        required: false
        type: string
        default: "0"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}

    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 🔍 Check Space (Before Cleanup)
        run: |
          echo "Disk space before cleanup:"
          df -h /

      - name: 🧹 Aggressive Cleanup
        run: |
          # Remove heavy pre-installed tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Prune Docker to remove hidden images and build cache
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: 🔍 Check Space (After Cleanup)
        run: |
          echo "Disk space after cleanup:"
          df -h /

      - name: "📐 Setup SWAP 8GB"
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 8

      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🧰 Setup Swapfile (optional)"
        run: |
          SWAP_GB="${{ github.event.inputs.swapSizeGB }}"
          if [ -z "$SWAP_GB" ]; then
            SWAP_GB=0
          fi

          if [ "$SWAP_GB" != "0" ]; then
            echo "Requested swap: ${SWAP_GB}G"
            if [ -f /swapfile ]; then
              echo "Existing /swapfile found, disabling and removing..."
              sudo swapoff /swapfile || true
              sudo rm -f /swapfile
            fi

            if command -v fallocate >/dev/null 2>&1; then
              echo "Creating swapfile with fallocate..."
              sudo fallocate -l ${SWAP_GB}G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024))
            else
              echo "fallocate not available, creating swapfile with dd..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024))
            fi

            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            sudo sysctl -w vm.swappiness=10 || true

            echo "SWAP_CREATED=true" >> $GITHUB_ENV
            echo "/swapfile created and activated (size: ${SWAP_GB}G)"
          else
            echo "No swap requested (swapSizeGB=${SWAP_GB})"
          fi
          
      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "🧬 Safe Kernel Version Spoof"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "🔧 Starting dynamic kernel version spoof..."
          
          SPOOF_VERSION="${{ github.event.inputs.kernelSpoofVersion }}"
          LOCAL_VERSION="${{ github.event.inputs.localVersion }}"
          FULL_VERSION="${SPOOF_VERSION}${LOCAL_VERSION}"
          
          if [ -z "$SPOOF_VERSION" ]; then
            echo "⚠️ No spoof version provided. Using default source version."
          else
            echo "➡️ Target Full Version: $FULL_VERSION"

            # 1. Hardcode KERNELVERSION including the local suffix
            sed -i "s/^KERNELVERSION =.*/KERNELVERSION = $FULL_VERSION/" Makefile
            
            # 2. Silence the setlocalversion script
            echo "" > .scmversion
            sed -i 's/echo "\$res"/#echo "\$res"/g' scripts/setlocalversion
            
            # 3. Force configuration overrides in defconfig
            CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
            sed -i '/CONFIG_LOCALVERSION/d' "$CONFIG_FILE"
            sed -i '/CONFIG_LOCALVERSION_AUTO/d' "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION=\"$LOCAL_VERSION\"" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

            # 4. Update build constants for GKI
            if [ -f "build.config.constants" ]; then
                sed -i "s/^KERNEL_VERSION=.*/KERNEL_VERSION=$FULL_VERSION/" build.config.constants
            fi

            echo "✅ Spoof applied successfully. Final name: $FULL_VERSION"
          fi
          
      - name: "📥 Initialize repo"
        working-directory: ${{ env.WORK_DIR}}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          echo "🔄 Syncing Android kernel build environment..."
          repo sync -c --optimized-fetch --prune --no-clone-bundle --no-tags --force-sync --fail-fast -j4
          echo "✅ Repo sync completed"
          
          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r584948.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r584948.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r584948
          tar -xzf prebuilts/clang/host/linux-x86/clang-r584948.tar.gz -C prebuilts/clang/host/linux-x86/clang-r584948
          rm -rf prebuilts/clang/host/linux-x86/clang-r584948.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r584948/' \
           ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants
          
          sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

          sed -i \
           -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
           -e '/^TRIM_NONLISTED_KMI=/d' \
           -e '/^KMI_ENFORCED=/d' \
           -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
           -e '$a\TRIM_NONLISTED_KMI=0' \
           -e '$a\KMI_ENFORCED=0' \
           -e '/^MODULES_ORDER=/d' \
           -e '/^MODULES_LIST=/d' \
           ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64

      - name: "⚙️ Configure kernel optimization and tick rate"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}";
          
          # Helper with proper error handling
          apply_patch() {
            local url="$1";
            local file=$(basename "$url")
            if ! curl -L -f -o "$file" "$url"; then
              echo "::error::Failed to download patch from $url"
              return 1
            fi
            # Check if it's a valid patch
            if ! head -1 "$file" | grep -q "^---"; then
              echo "::error::Invalid patch format from $url"
              cat "$file"
              return 1
            fi
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file (continuing)"
            rm -f "$file"
          }

          # custom tickrate options patch (may fail, but we continue)
          apply_patch "https://raw.githubusercontent.com/ShiningAsStar/extra_stuff/main/custom-tickrate-options.patch" || true
          
          # Remove any .rej files left by failed patches
          find . -name "*.rej" -delete
          
          # Remove existing optimization configs
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' "$CONFIG_FILE"
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3/d' "$CONFIG_FILE"
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_SIZE/d' "$CONFIG_FILE"
          
          # Apply selected optimization level
          case "${{ github.event.inputs.optimizationLevel }}" in
            O2)
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            O3)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            Os)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$CONFIG_FILE"
              ;;
          esac
         
          # Apply selected tick rate
          case "${{ github.event.inputs.tickRate }}" in
          default)
              echo Nothing to change. Keep Default.
              ;;
            100)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=100" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_100=y" >> "$CONFIG_FILE"
              ;;
            250)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=250" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_250=y" >> "$CONFIG_FILE"
              ;;
            300)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=300" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_300=y" >> "$CONFIG_FILE"
              ;;
            500)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=500" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_500=y" >> "$CONFIG_FILE"
              ;;
            600)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=600" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_600=y" >> "$CONFIG_FILE"
              ;;
            750)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=750" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_750=y" >> "$CONFIG_FILE"
              ;;
            1000)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=1000" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_1000=y" >> "$CONFIG_FILE"
              ;;
          esac

          # Remove any existing LTO FULL configuration
          sed -i '/^CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
    
          # LTO Configuration - Enable Thin LTO only
          if [ "${{ github.event.inputs.LtoOptimizations }}" = "thin" ]; then
           sed -i '/CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG=y" >> "$CONFIG_FILE"
           echo "# CONFIG_LTO_CLANG_FULL is not set" >> "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG_FILE"
           echo "CONFIG_THINLTO=y" >> "$CONFIG_FILE"
          else
           sed -i '/CONFIG_LTO_CLANG_FULL/d' "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG=y" >> "$CONFIG_FILE"
           echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG_FILE"
           echo "# CONFIG_LTO_CLANG_THIN is not set" >> "$CONFIG_FILE"
           echo "# CONFIG_THINLTO is not set" >> "$CONFIG_FILE"
          fi

          # Set localversion
          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"
          fi

          # Basic optimizations
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"

          # Extra TCP configs
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          EOF

          # Script sign patch
          apply_patch "https://raw.githubusercontent.com/ShiningAsStar/kernel_patches/main/0001-scripts-sign-builds.patch" || true

          echo "✅ Applied -${{ github.event.inputs.optimizationLevel }} Optimization"
          echo "✅ Applied ${{ github.event.inputs.tickRate }}Hz tick rate"

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.variant == 'ksu' && github.event.inputs.bbg == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "Adding BBG...";
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        
      - name: "🔧 Setup KernelSU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'kernelsu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e

          echo "📦 Installing KernelSU..."
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          echo "📦 Cloning SUSFS4KSU..."
          rm -rf susfs4ksu
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "📄 Installing SUSFS source files..."
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

          if ! grep -q "#include <linux/cred.h>" include/linux/susfs_def.h; then
            sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
          fi

          echo "🔧 Applying SUSFS kernel-side patch..."
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          if patch -p1 --forward --batch < "$SUSFS_PATCH"; then
            echo "✅ SUSFS kernel patch applied"
          else
            echo "⚠️ SUSFS patch had expected drift on newer 5.15; fixing task_mmu.c include manually"
          fi

          echo "🩹 Fixing SUSFS include for 5.15.208 task_mmu.c..."
          if ! grep -q "#include <linux/susfs_def.h>" fs/proc/task_mmu.c; then
            if grep -q "#include <trace/hooks/mm.h>" fs/proc/task_mmu.c; then
              perl -0pi -e 's@#include <trace/hooks/mm.h>@#include <trace/hooks/mm.h>\n#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif@' fs/proc/task_mmu.c
            else
              perl -0pi -e 's@#include <linux/pkeys.h>@#include <linux/pkeys.h>\n#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif@' fs/proc/task_mmu.c
            fi
          fi

          if [ -f fs/proc/task_mmu.c.rej ]; then
            if grep -q "linux/susfs_def.h" fs/proc/task_mmu.c.rej && [ "$(grep -c '^@@' fs/proc/task_mmu.c.rej)" -eq 1 ]; then
              rm -f fs/proc/task_mmu.c.rej
              echo "✅ Ignored known task_mmu.c include reject"
            else
              echo "::error::Unexpected task_mmu.c rejects"
              cat fs/proc/task_mmu.c.rej
              exit 1
            fi
          fi

          if find . -name "*.rej" | grep -q .; then
            echo "::error::Unexpected SUSFS patch rejects remain"
            find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
            exit 1
          fi

          grep -q "#include <linux/susfs_def.h>" fs/proc/task_mmu.c
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

          echo "📦 Integrating SUSFS with KernelSU..."
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ] && [ -d "KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* "KernelSU/kernel/"
          fi

          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if grep -Rqs "susfs_init();" "KernelSU/kernel"; then
            echo "✅ SUSFS already integrated in KernelSU"
          elif [ -f "$KSU_PATCH" ] && [ -d "KernelSU" ]; then
            cd "KernelSU"
            if patch -p1 --forward --fuzz=3 < "../$KSU_PATCH"; then
              echo "✅ Applied KSU-side SUSFS patch"
            else
              echo "⚠️ KSU-side SUSFS patch already applied or failed; continuing"
              find . -name "*.rej" -delete
            fi
            cd ..
          else
            echo "⚠️ Unable to find KernelSU or KSU-side SUSFS patch; continuing after source injection"
          fi

          echo "📝 Configuring KSU SUSFS..."
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          sed -i '/^CONFIG_KSU=/d' "$CONFIG_FILE"
          sed -i '/^CONFIG_KSU_SUSFS=/d' "$CONFIG_FILE"
          sed -i '/^CONFIG_KSU_SUSFS_/d' "$CONFIG_FILE"

          cat >> "$CONFIG_FILE" << 'SUSFSCONFIG'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
