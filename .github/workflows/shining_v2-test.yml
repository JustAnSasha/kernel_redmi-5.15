name: "Build kernels (NoKSU, SukiSU, RESukisu and NEXT.) TEST"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/ShiningAsStar/kernel_redmi-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: true
        type: choice
        default: "shining"
        options:
          - "google"
          - "shining"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      kernelSpoofVersion:
        description: "Spoof kernel version (format: X.Y.Z)"
        required: false
        type: string
        default: "6.1.100"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: "-Shiney"
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "ksu"
        options:
          - "noksu"
          - "ksu"
          - "both"
      ksuVariant:
        description: "KSU implementation (if KSU enabled)"
        required: true
        type: choice
        default: "sukisu-ultra"
        options:
          - "kernelsu"
          - "sukisu-ultra"
          - "resukisu"
          - "next"
      optimizationLevel:
        description: "Compiler optimization level"
        required: false
        type: choice
        default: "O3"
        options:
          - "O2"
          - "O3"
          - "Os"
      tickRate:
        description: "Kernel tick rate (Hz)"
        required: false
        type: choice
        default: "300"
        options:
          - "default"
          - "100"
          - "250"
          - "300"
          - "500"
          - "600"
          - "750"
          - "1000"
      bbg:
        description: "Baseband-guard Support (if KSU Enabled)"
        required: true
        type: choice
        default: "on"
        options:
          - "on"
          - "off"
      LtoOptimizations:
        description: "Choose LTO"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"
      KPM:
        description: "Kernel Patch Image for SukiSU/ReSukiSU (if KSU enabled)"
        required: true
        type: choice
        default: "off"
        options:
          - "on"
          - "off"
      swapSizeGB:
        description: "Extra swapfile size in GB (0 disables)"
        required: false
        type: string
        default: "0"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}

    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: "🧹 Cleanup & Setup Swap"
        run: |
          echo "Disk space before cleanup:" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo docker builder prune -a -f
          echo "Disk space after cleanup:" && df -h /

          SWAP_GB="${{ github.event.inputs.swapSizeGB }}"
          if [ -z "$SWAP_GB" ] || [ "$SWAP_GB" = "0" ]; then
            SWAP_GB=8
          fi
          
          echo "Setting up ${SWAP_GB}GB swap..."
          if [ -f /swapfile ]; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile
          fi
          sudo fallocate -l ${SWAP_GB}G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024))
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "🧬 Safe Kernel Version Spoof"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "🔧 Starting dynamic kernel version spoof..."
          SPOOF_VERSION="${{ github.event.inputs.kernelSpoofVersion }}"
          LOCAL_VERSION="${{ github.event.inputs.localVersion }}"
          FULL_VERSION="${SPOOF_VERSION}${LOCAL_VERSION}"
          
          if [ -z "$SPOOF_VERSION" ]; then
            echo "⚠️ No spoof version provided. Using default source version."
          else
            echo "➡️ Target Full Version: $FULL_VERSION"
            sed -i "s/^KERNELVERSION =.*/KERNELVERSION = $FULL_VERSION/" Makefile
            echo "" > .scmversion
            sed -i 's/echo "\$res"/#echo "\$res"/g' scripts/setlocalversion
            
            CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
            sed -i '/CONFIG_LOCALVERSION/d' "$CONFIG_FILE"
            sed -i '/CONFIG_LOCALVERSION_AUTO/d' "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION=\"$LOCAL_VERSION\"" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

            if [ -f "build.config.constants" ]; then
                sed -i "s/^KERNEL_VERSION=.*/KERNEL_VERSION=$FULL_VERSION/" build.config.constants
            fi
            echo "✅ Spoof applied successfully. Final name: $FULL_VERSION"
          fi
          
      - name: "📥 Initialize repo"
        working-directory: ${{ env.WORK_DIR}}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          echo "🔄 Syncing Android kernel build environment..."
          repo sync -c --optimized-fetch --prune --no-clone-bundle --no-tags --force-sync --fail-fast -j4
          echo "✅ Repo sync completed"
          
          rm -rf .repo common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r584948.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r584948.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r584948
          tar -xzf prebuilts/clang/host/linux-x86/clang-r584948.tar.gz -C prebuilts/clang/host/linux-x86/clang-r584948
          rm -rf prebuilts/clang/host/linux-x86/clang-r584948.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846 prebuilts/clang/host/linux-x86/clang-r450784e prebuilts/clang/host/linux-x86/clang-stable
          
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r584948/' \
           ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants
          
          sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

          sed -i \
           -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
           -e '/^TRIM_NONLISTED_KMI=/d' \
           -e '/^KMI_ENFORCED=/d' \
           -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
           -e '$a\TRIM_NONLISTED_KMI=0' \
           -e '$a\KMI_ENFORCED=0' \
           -e '/^MODULES_ORDER=/d' \
           -e '/^MODULES_LIST=/d' \
           ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64

      - name: "⚙️ Configure kernel optimization and tick rate"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}";
          
          apply_patch() {
            local url="$1"; local file=$(basename "$url")
            if ! curl -L -f -o "$file" "$url"; then
              echo "::error::Failed to download patch from $url"
              return 1
            fi
            if ! head -1 "$file" | grep -q "^---"; then
              echo "::error::Invalid patch format from $url"
              cat "$file"; return 1
            fi
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file (continuing)"
            rm -f "$file"
          }

          apply_patch "https://raw.githubusercontent.com/ShiningAsStar/extra_stuff/main/custom-tickrate-options.patch" || true
          find . -name "*.rej" -delete
          
          sed -i -E '/CONFIG_CC_OPTIMIZE_FOR_(PERFORMANCE|PERFORMANCE_O3|SIZE)/d' "$CONFIG_FILE"
          case "${{ github.event.inputs.optimizationLevel }}" in
            O2)
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            O3)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            Os)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$CONFIG_FILE"
              ;;
          esac
         
          HZ="${{ github.event.inputs.tickRate }}"
          if [ "$HZ" != "default" ]; then
            for val in 100 250 300 500 600 750 1000; do
              sed -i "/^CONFIG_HZ_${val}=/d" "$CONFIG_FILE"
            done
            echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
            echo "CONFIG_HZ=${HZ}" >> "$CONFIG_FILE"
            echo "CONFIG_HZ_${HZ}=y" >> "$CONFIG_FILE"
          fi

          sed -i -E '/CONFIG_(LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|THINLTO)/d' "$CONFIG_FILE"
          echo "CONFIG_LTO_CLANG=y" >> "$CONFIG_FILE"
          if [ "${{ github.event.inputs.LtoOptimizations }}" = "thin" ]; then
            echo "# CONFIG_LTO_CLANG_FULL is not set" >> "$CONFIG_FILE"
            echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG_FILE"
            echo "CONFIG_THINLTO=y" >> "$CONFIG_FILE"
          else
            echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG_FILE"
            echo "# CONFIG_LTO_CLANG_THIN is not set" >> "$CONFIG_FILE"
            echo "# CONFIG_THINLTO is not set" >> "$CONFIG_FILE"
          fi

          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"
          fi

          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"

          sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          EOF

          apply_patch "https://raw.githubusercontent.com/ShiningAsStar/kernel_patches/main/0001-scripts-sign-builds.patch" || true
          echo "✅ Applied -${{ github.event.inputs.optimizationLevel }} Optimization"
          echo "✅ Applied ${{ github.event.inputs.tickRate }}Hz tick rate"

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.variant == 'ksu' && github.event.inputs.bbg == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "Adding BBG...";
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: "🔧 Setup KSU & SUSFS (KSU variant only)"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
          VARIANT="${{ github.event.inputs.ksuVariant }}"

          echo "📦 Cloning SUSFS4KSU..."
          rm -rf susfs4ksu
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "📄 Installing SUSFS source files..."
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

          if ! grep -q "#include <linux/cred.h>" include/linux/susfs_def.h; then
            sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
          fi

          echo "🔧 Applying SUSFS kernel-side patch..."
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if patch -p1 --forward --batch < "$SUSFS_PATCH"; then
            echo "✅ SUSFS kernel patch applied"
          else
            echo "⚠️ SUSFS patch had expected drift on newer 5.15; fixing task_mmu.c include manually"
          fi

          echo "🩹 Fixing SUSFS include for task_mmu.c..."
          if ! grep -q "#include <linux/susfs_def.h>" fs/proc/task_mmu.c; then
            if grep -q "#include <trace/hooks/mm.h>" fs/proc/task_mmu.c; then
              perl -0pi -e 's@#include <trace/hooks/mm.h>@#include <trace/hooks/mm.h>\n#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif@' fs/proc/task_mmu.c
            else
              perl -0pi -e 's@#include <linux/pkeys.h>@#include <linux/pkeys.h>\n#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif@' fs/proc/task_mmu.c
            fi
          fi

          if [ -f fs/proc/task_mmu.c.rej ]; then
            if grep -q "linux/susfs_def.h" fs/proc/task_mmu.c.rej && [ "$(grep -c '^@@' fs/proc/task_mmu.c.rej)" -eq 1 ]; then
              rm -f fs/proc/task_mmu.c.rej
            else
              echo "::error::Unexpected task_mmu.c rejects"
              cat fs/proc/task_mmu.c.rej
              exit 1
            fi
          fi

          echo "📦 Installing KSU variant: $VARIANT..."
          rm -rf KernelSU KernelSU-Next drivers/kernelsu

          case "$VARIANT" in
            kernelsu)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
              KSU_DIR="KernelSU"
              ;;
            sukisu-ultra)
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
              KSU_DIR="KernelSU"
              ;;
            resukisu)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
              KSU_DIR="KernelSU"
              ;;
            next)
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              KSU_DIR="KernelSU-Next"
              ;;
          esac

          if [ "$VARIANT" = "kernelsu" ] || [ "$VARIANT" = "next" ]; then
            echo "📦 Integrating SUSFS with $KSU_DIR..."
            if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
              cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* "$KSU_DIR/kernel/"
            fi
            
            KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            if grep -Rqs "susfs_init();" "$KSU_DIR/kernel"; then
               echo "✅ SUSFS already integrated"
            elif [ -f "$KSU_PATCH" ]; then
               cd "$KSU_DIR"
               patch -p1 --forward --fuzz=3 < "../$KSU_PATCH" || find . -name "*.rej" -delete
               cd ..
            fi
          fi

          if [ "$VARIANT" = "next" ]; then
            echo "📦 Applying KernelSU-Next extra patches..."
            curl -LSs "https://raw.githubusercontent.com/nebixts/kernel_patches/main/69_hide_stuff.patch" | patch -p1 -F 3 || echo "⚠️ Hide stuff patch skipped"
            curl -LSs "https://raw.githubusercontent.com/nebixts/kernel_patches/main/scope_min_manual_hooks_v1.9.patch" | patch -p1 --fuzz=3 || echo "⚠️ Manual hooks patch skipped"
          fi

          find . -name "*.rej" -delete

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i -E '/^CONFIG_KSU(_SUSFS)?(_[A-Z0-9_]+)?=/d' "$CONFIG_FILE"

          if [ "$VARIANT" = "resukisu" ]; then
            sed -i -E '/^CONFIG_KSU_(TRACEPOINT|MANUAL)_HOOK=/d' "$CONFIG_FILE"
            sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
            CONFIG_KSU=y
            # CONFIG_KSU_TRACEPOINT_HOOK is not set
            # CONFIG_KSU_MANUAL_HOOK is not set
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_SUSFS_SUS_PATH=y
            CONFIG_KSU_SUSFS_SUS_MOUNT=y
            CONFIG_KSU_SUSFS_SUS_KSTAT=y
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y
            CONFIG_KSU_SUSFS_ENABLE_LOG=y
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
            CONFIG_KSU_SUSFS_SUS_MAP=y
            CONFIG_TMPFS_XATTR=y
            CONFIG_TMPFS_POSIX_ACL=y
            CONFIG_KALLSYMS=y
            EOF
          else
            sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
            CONFIG_KSU=y
            CONFIG_KPROBES=y
            CONFIG_HAVE_KPROBES=y
            CONFIG_KPROBE_EVENTS=y
            CONFIG_OVERLAY_FS=y
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
            CONFIG_KSU_SUSFS_SUS_PATH=y
            CONFIG_KSU_SUSFS_SUS_MOUNT=y
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
            CONFIG_KSU_SUSFS_SUS_KSTAT=y
            CONFIG_KSU_SUSFS_TRY_UMOUNT=y
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y
            CONFIG_KSU_SUSFS_ENABLE_LOG=y
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
            CONFIG_KSU_SUSFS_SUS_MAP=y
            CONFIG_KSU_SUSFS_SUS_SU=y
            CONFIG_TMPFS_XATTR=y
            CONFIG_TMPFS_POSIX_ACL=y
            CONFIG_KALLSYMS=y
            EOF
          fi

          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          rm -rf susfs4ksu
          echo "🎉 Setup for KSU variant $VARIANT completed successfully!"

      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          export KBUILD_BUILD_USER=ShiningAsStar
          export KBUILD_BUILD_HOST=GitHub
          echo "🚀 Starting kernel compilation..."
          export KERNEL_VERSION="${{ github.event.inputs.kernelSpoofVersion }}${{ github.event.inputs.localVersion }}"
          export KCFLAGS="-Wno-error=unused-variable -Wno-error=unused-label"
          
          if [ "${{ github.event.inputs.LtoOptimizations }}" = "thin" ]; then
            echo "Using Thin LTO optimization"
            LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          else
            echo "Using Full LTO optimization"
            LTO=full BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          fi
            
      - name: "🧩 Patch Kernel Image (KPM) for SukiSU/ReSukiSU"
        if: matrix.variant == 'ksu' && github.event.inputs.KPM == 'on' && (github.event.inputs.ksuVariant == 'sukisu-ultra' || github.event.inputs.ksuVariant == 'resukisu')
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          set -e
          echo "🔧 Downloading KPM tool..."
          curl -fL -o patch_linux https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
          chmod +x patch_linux
          echo "🔧 Patching Kernel..."
          ./patch_linux
          if [ -f oImage ]; then
            rm -f Image
            mv oImage Image
            echo "✅ KPM Patch Applied Successfully"
          else
            echo "❌ Error: oImage was not created by the patch tool!"
            exit 1
          fi

      - name: "📦 Prepare artifact"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          VARIANT_NAME="${{ matrix.variant }}";
          cp out/dist/Image Image.$VARIANT_NAME
          echo "ARTIFACT_NAME=kernel-${VARIANT_NAME}-${{ github.event.inputs.optimizationLevel }}-${{ github.event.inputs.tickRate }}hz" >> $GITHUB_ENV
          echo "IMAGE_NAME=Image.$VARIANT_NAME" >> $GITHUB_ENV

      - name: 🔍 Check Space (Post-Build)
        if: always()
        run: |
          echo "Final disk space status:"
          df -h /

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORK_DIR }}/${{ env.IMAGE_NAME }}
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d')
          
          mkdir AnyKernel3 && cd AnyKernel3
          git init
          git remote add origin https://github.com/ShiningAsStar/AnyKernel3
          
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          
          echo "/*" > .git/info/sparse-checkout
          echo "!/LICENSE" >> .git/info/sparse-checkout
          echo "!/README.md" >> .git/info/sparse-checkout
          
          git pull --depth=1 origin master
          cd ..
          
          find kernels -name "Image.*" -exec cp {} AnyKernel3/ \;
          
          KSU_INFO=""
          if [ "${{ github.event.inputs.buildKSU }}" != "noksu" ]; then
            KSU_INFO="_${{ github.event.inputs.ksuVariant }}"
          fi
          
          ZIP_NAME="Anykernel3_${{ github.event.inputs.kernelBranch }}${KSU_INFO}_${{ github.event.inputs.optimizationLevel }}_${{ github.event.inputs.tickRate }}hz_${BUILD_TIME}.zip"
          ART_NAME="Anykernel3_${{ github.event.inputs.kernelBranch }}${KSU_INFO}_${{ github.event.inputs.optimizationLevel }}_${{ github.event.inputs.tickRate }}hz_${BUILD_TIME}"
          
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ART_NAME=$ART_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: "📱 Send to Telegram"
        if: always()
        run: |
         if [[ -f "${{ env.ZIP_PATH }}" ]]; then
          KSU_TEXT=""
         if [ "${{ github.event.inputs.buildKSU }}" != "noksu" ]; then
          KSU_TEXT="
         🔐 *KSU Variant:* \`${{ github.event.inputs.ksuVariant }}\`"
         fi
      
         CAPTION="✅ *Kernel Build Successful*

         📦 *Build Information:*
         • Kernel: \`Linux ${{ env.KERNEL_VERSION }}\`
         • Android: \`13-17\`
         • Branch: \`${{ github.event.inputs.kernelBranch }}\`
         • Device: \`${{ github.event.inputs.kernelDevice }}\`

         ⚙️ *Configuration:*
         • Optimization: \`-${{ github.event.inputs.optimizationLevel }}\`
         • Tick Rate: \`${{ github.event.inputs.tickRate }}Hz\`
         • Build Type: \`${{ github.event.inputs.buildKSU }}\`${KSU_TEXT}
         • Local Version: \`${{ github.event.inputs.localVersion }}\`

         🕐 *Build Date:* $(date '+%Y-%m-%d %H:%M:%S UTC')
         📦 *Package:* \`${{ env.ART_NAME }}\`"

         curl -s -F document=@"${{ env.ZIP_PATH }}" \
           -F caption="$CAPTION" \
           -F parse_mode="Markdown" \
           -F chat_id=${{ secrets.TELEGRAM_USER_ID }} \
           "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
         else
         FAILURE_MSG="❌ *Kernel Build Failed*

         📦 *Build Information:*
         • Kernel: \`Linux ${{ env.KERNEL_VERSION }}\`
         • Android: \`13-17\`
         • Branch: \`${{ github.event.inputs.kernelBranch }}\`
         • Device: \`Redmi Note 12/13 4G. Pad SE\`

         ⚙️ *Configuration:*
         • Optimization: \`-${{ github.event.inputs.optimizationLevel }}\`
         • Tick Rate: \`${{ github.event.inputs.tickRate }}Hz\`
         • Build Type: \`${{ github.event.inputs.buildKSU }}\`
         • Local Version: \`${{ github.event.inputs.localVersion }}\`

         🕐 *Failed at:* $(date '+%Y-%m-%d %H:%M:%S UTC')

         🔍 Check the [workflow logs](<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>) for details."

         curl -s -X POST \
           -d chat_id=${{ secrets.TELEGRAM_USER_ID }} \
           -d text="$FAILURE_MSG" \
           -d parse_mode="Markdown" \
           "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
         fi
         
