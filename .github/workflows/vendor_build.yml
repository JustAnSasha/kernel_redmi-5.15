name: Build Sapphire 64-bit Vendor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Server Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        
    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync Source
      run: |
        mkdir android && cd android
        git config --global user.name "Project Builder"
        git config --global user.email "builder@example.com"
        
        repo init -u https://github.com/LineageOS/android.git -b lineage-23.0 --git-lfs --depth=1
        
        git clone https://github.com/saroj-nokia/device_xiaomi_sapphire.git -b lineage-23.2 device/xiaomi/sapphire
        git clone https://github.com/saroj-nokia/vendor_xiaomi_sapphire.git -b lineage-23.2 vendor/xiaomi/sapphire
        
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Build Vendor Image
      run: |
        cd android
        source build/envsetup.sh
        lunch lineage_sapphire-userdebug
        m vendorimage -j$(nproc --all)

    - name: Upload Vendor Image
      uses: actions/upload-artifact@v4
      with:
        name: sapphire-64bit-vendor
        path: android/out/target/product/sapphire/vendor.img
        
