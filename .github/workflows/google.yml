name: "Cook_K_CL22"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/nebixts/sd685_kernel_msm-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: false
        type: choice
        default: "google"
        options:
          - "google"
          - "zepharo"
          - "codelinaro"
          - "topnotchfreaks"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: "-NeFaRiaN-3.5-G-11062026"
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "ksu"
        options:
          - "noksu"
          - "ksu"
          - "both"
      ksuVariant:
        description: "KSU implementation (if KSU enabled)"
        required: true
        type: choice
        default: "NEXT"
        options:
          - "KERNELSU"
          - "NEXT"
          - "RESUKISU"
          - "WKSU"
      KPM:
        description: "Kernel Patch Image for Sukisu/Resukisu (if KSU Enabled)"
        required: true
        type: choice
        default: "off"
        options:
          - "on"
          - "off"
      optimizationLevel:
        description: "Compiler optimization level"
        required: false
        type: choice
        default: "O3"
        options:
          - "default"
          - "O2"
          - "O3"
          - "Os"
      tickRate:
        description: "Kernel tick rate (Hz)"
        required: false
        type: choice
        default: "500"
        options:
          - "default"
          - "100"
          - "250"
          - "300"
          - "500"
          - "600"
          - "750"
          - "1000"
      bbg:
        description: "Baseband-guard Support (if KSU Enabled)"
        required: true
        type: choice
        default: "on"
        options:
          - "on"
          - "off"
      swapSizeGB:
        description: "Optional swap size in GB to create on the runner (set 0 to disable)"
        required: false
        type: string
        default: "8"
      LTOOptimizations:
        description: "Choose LTO"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
          
    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

      # ====================== Start Preparation Stage ======================

    steps:
      - name: "✨ Setup WorkSpace"
        run: |
          mkdir -p $kernelDir
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 build-essential bc curl flex cpio rsync git zip dwarves libelf-dev gcc-aarch64-linux-gnu libssl-dev python3 clang lld llvm llvm-dev

      - name: 🔍 Check Space (Before CleanUp)
        run: |
          echo "Disk space before cleanup:"
          df -h /

      - name: 🧹 Aggressive CleanUp
        run: |
          # Remove heavy pre-installed tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Prune Docker to remove hidden images and build cache
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: 🔍 Check Space (After Cleanup)
        run: |
          echo "Disk space after cleanup:"
          df -h /

      - name: "🧰 Setup Swapfile (optional)"
        run: |
          SWAP_GB="${{ github.event.inputs.swapSizeGB }}"
          if [ -z "$SWAP_GB" ]; then
            SWAP_GB=0
          fi

          if [ "$SWAP_GB" != "0" ]; then
            echo "Requested swap: ${SWAP_GB}G"
            if [ -f /swapfile ]; then
              echo "Existing /swapfile found, disabling and removing..."
              sudo swapoff /swapfile || true
              sudo rm -f /swapfile
            fi

            if command -v fallocate >/dev/null 2>&1; then
              echo "Creating swapfile with fallocate..."
              sudo fallocate -l ${SWAP_GB}G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024))
            else
              echo "fallocate not available, creating swapfile with dd..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024))
            fi

            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            sudo sysctl -w vm.swappiness=10 || true

            echo "SWAP_CREATED=true" >> $GITHUB_ENV
            echo "/swapfile created and activated (size: ${SWAP_GB}G)"
          else
            echo "No swap requested (swapSizeGB=${SWAP_GB})"
          fi

      # ====================== Source Code Preparation Stage ======================

      - name: "🌟 Clone Kernel Source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "📥 Initialize ToolChain Repo"
        working-directory: ${{ env.WORK_DIR}}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
          
          rm -rf .repo
          rm -rf common
                                                                                    
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r596125.tar.gz "https://github.com/nebixts/clang_L/releases/download/v2.0.4/clang-r596125.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r596125
          tar -xzf prebuilts/clang/host/linux-x86/clang-r596125.tar.gz -C prebuilts/clang/host/linux-x86/clang-r596125
          rm -rf prebuilts/clang/host/linux-x86/clang-r596125.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
         
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r596125/' \
           ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants
          
          sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

          sed -i \
           -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
           -e '/^TRIM_NONLISTED_KMI=/d' \
           -e '/^KMI_ENFORCED=/d' \
           -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
           -e '$a\TRIM_NONLISTED_KMI=0' \
           -e '$a\KMI_ENFORCED=0' \
           -e '/^MODULES_ORDER=/d' \
           -e '/^MODULES_LIST=/d' \
           ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64
   
      - name: "📐 Setup SWAP 24GB"
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 24

      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "⚙️ Configure Kernel Optimization and TickRate"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}";
          
          # Helper
          apply_patch() {
            local url="$1";
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }
          
          # Remove existing optimization configs
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' "$CONFIG_FILE"
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3/d' "$CONFIG_FILE"
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_SIZE/d' "$CONFIG_FILE"
          
          # Apply selected optimization level
          case "${{ github.event.inputs.optimizationLevel }}" in
            default)
              # nothing to add here (keep it default)
              ;;
            O2)
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            O3)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              
              patch -p1 "https://raw.githubusercontent.com/nebixts/kernel_patches/main/add_-03.patch"
          
              grep "KBUILD_CFLAGS += -O3" Makefile || (echo "Patch failed!" && exit 1)
              ;;
            Os)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$CONFIG_FILE"
              ;;
          esac
        
          apply_patch "https://raw.githubusercontent.com/nebixts/kernel_patches/main/custom_tickrate_options.patch"
          
          case "${{ github.event.inputs.tickRate }}" in
            default)
              echo Nothing to change. Keep Default.
              ;;
            100)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=100" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_100=y" >> "$CONFIG_FILE"
              ;;
            250)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=250" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_250=y" >> "$CONFIG_FILE"
              ;;
            300)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=300" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_300=y" >> "$CONFIG_FILE"
              ;;
            500)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=500" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_500=y" >> "$CONFIG_FILE"
              ;;
            600)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=600" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_600=y" >> "$CONFIG_FILE"
              ;;
            750)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=750" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_750=y" >> "$CONFIG_FILE"
              ;;
            1000)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=1000" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_1000=y" >> "$CONFIG_FILE"
              ;;
          esac
          
          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n\"" >> "$CONFIG_FILE"
          fi
          
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KALLSYMS_ALL=y >> $CONFIG_FILE"
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          EOF
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          EOF
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          EOF
        
          apply_patch "https://raw.githubusercontent.com/nebixts/kernel_patches/main/0001-scripts-sign-builds.patch"
          
          echo "✅ Applied -${{ github.event.inputs.optimizationLevel }} Optimization"
          echo "✅ Applied ${{ github.event.inputs.tickRate }}Hz tick rate"
          echo "✅ Applied Full Meta Module Support"
          echo "✅ Applied Extra TCP configs"
          echo "✅ Applied Networking Configuration"
          echo "✅ Applied IPSet Support"

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.variant == 'ksu' && github.event.inputs.bbg == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "Adding BBG...";
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      # ====================== Begin Processing Root Kernel  base of KernelSU Stage ======================

      - name: "⚡ Setup KernelSU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'KERNELSU'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e

          echo "📦 Installing KernelSU..."
          # Clones into the 'KernelSU' directory automatically
          curl -LSs "https://raw.githubusercontent.com/nebixts/KSU/refs/heads/main/kernel/setup.sh" | bash -s main
          echo "✔ KernelSU installed successfully"

          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "📄 Forcing SUSFS source injection..."
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          fi
     
          # Save absolute path to patch before moving directories
          KSU_KERNEL_PATCH="$(pwd)/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          SUSFS_KERNEL_PATCH="$(pwd)/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          echo "🔧 Applying KSU KERNEL PATCH..."
          cd KernelSU
          if patch -p1 < "$KSU_KERNEL_PATCH"; then
            echo "✅ KSU patch successfully applied"
          else
            echo "⚠️ KSU patch failed — common on non-GKI"
          fi
          cd .. # Return to kernel root directory
    
          echo "🔧 Applying SUSFS KERNEL PATCH..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed — common on non-GKI"
          fi

          echo "📦 Applying hide_stuff patch"
          curl -LSs "https://raw.githubusercontent.com/nebixts/kernel_patches/main/69_hide_stuff.patch" | patch -p1 -F 3 || echo "⚠️ Hide stuff patch skipped"

          echo "📝 Applying Defconfig Settings..."
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$CONFIG_FILE" ]; then
            if ! grep -q "CONFIG_KSU=y" "$CONFIG_FILE"; then
              cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          fi
          else
          echo "❌ Defconfig file not found at $CONFIG_FILE"
          exit 1
          fi

          echo "✅ KernelSU with SUSFS Integration Successfully Completed"

      - name: "🛠️ Setup NEXT with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'NEXT'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
           set -e
           # Define internal path for diagnostics
           KSU_NEXT_DIR="KernelSU-Next/kernel"

           echo "📦 Installing NEXT..."
           # The setup script usually clones into KernelSU-Next automatically
           curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
           echo "✔ NEXT installed successfully"

           #echo "📦 Enabling multimanager support..."
           #curl -LSs "https://raw.githubusercontent.com/nebixts/kernel_patches/main/kernelsu-next_multimanager.patch" | patch -p1 --directory=KernelSU-Next
  
           echo "📦 Cloning SUSFS4KSU..."
           git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

           echo "📄 Forcing SUSFS source injection..."
           mkdir -p fs include/linux
           cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
           cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
           [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ] && cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
           
           # Applying Patches (Execute from Kernel Root)
           SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
           echo "🔧 Applying SUSFS kernel patch..."
           if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
             echo "✅ SUSFS patch successfully applied"
           else
             echo "⚠️ SUSFS patch failed — common on non-GKI, files will be forced manually"
           fi

           echo "📦 Applying hide_stuff & manual_hooks..."
           curl -LSs "https://raw.githubusercontent.com/nebixts/kernel_patches/main/69_hide_stuff.patch" | patch -p1 -F 3 || echo "⚠️ Hide stuff patch skipped"
           curl -LSs "https://raw.githubusercontent.com/nebixts/kernel_patches/main/scope_min_manual_hooks_v1.9.patch" | patch -p1 --fuzz=3 || echo "⚠️ Manual hooks patch skipped"

           # 5. Config injection
           CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
           echo "📝 Configuring $CONFIG_FILE"
           # Use grep to check if KSU is already defined to avoid duplicates
           if ! grep -q "CONFIG_KSU=y" "$CONFIG_FILE"; then
           cat >> "$CONFIG_FILE" << 'EOF'
           CONFIG_KSU=y
           CONFIG_KPROBES=y
           CONFIG_HAVE_KPROBES=y
           CONFIG_KPROBE_EVENTS=y
           CONFIG_KSU_SUSFS=y
           CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
           CONFIG_KSU_SUSFS_SUS_PATH=y
           CONFIG_KSU_SUSFS_SUS_MOUNT=y
           CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
           CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
           CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
           CONFIG_KSU_SUSFS_SUS_KSTAT=y
           CONFIG_KSU_SUSFS_TRY_UMOUNT=y
           CONFIG_KSU_SUSFS_SPOOF_UNAME=y
           CONFIG_KSU_SUSFS_ENABLE_LOG=y
           CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
           CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
           CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
           CONFIG_KSU_SUSFS_SUS_MAP=y
           CONFIG_KSU_SUSFS_SUS_SU=y
           EOF
           fi

           echo "🎉 NEXT with SUSFS Integration complete!"

      - name: "🔧 Setup RESUKISU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'RESUKISU'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
    
          echo "📦 Installing RESUKISU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo "✔ RESUKISU installed successfully (Version: $KSU_VERSION)"
    
          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "📄 Forcing SUSFS source injection..."
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          fi
     
          # Save absolute path to patch before moving directories
          SUSFS_KERNEL_PATCH="$(pwd)/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          echo "🔧 Applying SUSFS KERNEL PATCH..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed — common on non-GKI"
          fi

          echo "📦 Applying hide_stuff patch"
          curl -LSs "https://raw.githubusercontent.com/nebixts/kernel_patches/main/69_hide_stuff.patch" | patch -p1 -F 3 || echo "⚠️ Hide stuff patch skipped"
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "📝 Configuring $CONFIG_FILE"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPM=n
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
    
          echo "✔ RESUKISU configs with SUSFS added"
    
          # Workspace cleaning
          rm -rf ./susfs4oki ./kernel_patches ./SukiSU_patch
    
          echo "✅ Installed RESUKISU with SUSFS Successfully"

      - name: "🔧 Setup Wild-KSU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'WKSU'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
    
          # Clean existing installations
          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU
    
          echo "📦 Installing Wild-KSU..."
          curl -LSs "https://raw.githubusercontent.com/nebixts/wksu/canary/kernel/setup.sh" | bash -s canary
    
          if [ ! -d "Wild_KSU" ]; then
            echo "❌ ERROR: Wild_KSU directory not found after installation!"
            exit 1
          fi
          echo "✔ Wild-KSU installed successfully"
    
          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
    
          if [ ! -d "susfs4ksu" ]; then
            echo "❌ ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi
    
          # Apply SUSFS kernel patch
          echo "🔧 Applying SUSFS kernel patch..."
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
    
          if [ -f "$SUSFS_PATCH" ]; then
            if patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "✅ SUSFS kernel patch applied successfully"
            else
              echo "⚠️ Patch had some issues, but continuing..."
            fi
            else
              echo "⚠️ SUSFS patch file not found: $SUSFS_PATCH"
           fi

           # --- CRITICAL MANUAL FIXES ---
    
           # 1. Force copy SUSFS source files (in case patch failed to create them)
           echo "📄 Installing SUSFS source files..."
           mkdir -p fs include/linux
           cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
           cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
           cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
    
           # 2. FIX: Add susfs.o to fs/Makefile (Solves 'undefined symbol: susfs_run_sus_path_loop')
           if ! grep -q "susfs.o" fs/Makefile; then
             echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
             echo "✔ Added susfs.o to fs/Makefile"
           fi
    
           # 3. FIX: Make susfs_run_sus_path_loop non-static (Solves linking error)
           sed -i 's/static void susfs_run_sus_path_loop/void susfs_run_sus_path_loop/g' fs/susfs.c
           echo "✔ Made susfs_run_sus_path_loop global"
    
           # 4. FIX: Inject missing 'fake_state' in services.c if patch failed
           SERVICES_C="security/selinux/ss/services.c"
           if grep -q "fake_state" "$SERVICES_C" && ! grep -q "struct selinux_state fake_state =" "$SERVICES_C"; then
           # Inject definition before the first usage or at end of includes
           sed -i '/#include <linux\/susfs.h>/a struct selinux_state fake_state = { .disabled = 1 };' "$SERVICES_C" || \
           sed -i '/#include "services.h"/a struct selinux_state fake_state = { .disabled = 1 };' "$SERVICES_C"
           echo "✔ Injected missing fake_state definition"
           fi
    
           # Apply KSU SUSFS patch
           echo "🔧 Integrating SUSFS into KernelSU..."
           cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
    
           KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
           KSU_C_FILE="Wild_KSU/kernel/ksu.c"
    
           # Try applying KSU patch
           cd Wild_KSU
           patch -p1 --forward < "../$KSU_PATCH" || echo "⚠️ KSU Patch failed, applying manual fixes..."
           cd ..
    
           # 5. FIX: Manual KSU Integration & Symbol Exports (Solves 'undefined symbol: ksu_...')
    
           # Add susfs.h include
           if ! grep -q "#include <linux/susfs.h>" "$KSU_C_FILE"; then
             sed -i '1s/^/#include <linux\/susfs.h>\n/' "$KSU_C_FILE"
           fi
    
           # Hook susfs_init inside ksu_init
           if ! grep -q "susfs_init()" "$KSU_C_FILE"; then
             sed -i '/int __init ksu_init(/,/^}/ { /return 0;/i \\tsusfs_init();' "$KSU_C_FILE"
           fi
    
           # EXPORT missing symbols for linker
           if ! grep -q "EXPORT_SYMBOL(ksu_is_init_rc_hook_enabled)" "$KSU_C_FILE"; then
             echo "EXPORT_SYMBOL(ksu_is_init_rc_hook_enabled);" >> "$KSU_C_FILE"
             echo "EXPORT_SYMBOL(ksu_is_input_hook_enabled);" >> "$KSU_C_FILE"
             echo "✔ Exported missing KSU symbols"
           fi
    
           # Ensure drivers/kernelsu symlink exists
           if [ ! -L "drivers/kernelsu" ]; then
             ln -sf ../Wild_KSU drivers/kernelsu
           fi
    
           # Ensure drivers/kernelsu symlink exists
           if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
           fi   
    
           # Add Wild-KSU and SUSFS configs
           CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
           echo "📝 Configuring $CONFIG_FILE"
           cat >> "$CONFIG_FILE" << 'EOF'
           CONFIG_KSU=y
           CONFIG_KPROBES=y
           CONFIG_HAVE_KPROBES=y
           CONFIG_KPROBE_EVENTS=y
           CONFIG_KSU_SUSFS=y
           CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
           CONFIG_KSU_SUSFS_SUS_PATH=y
           CONFIG_KSU_SUSFS_SUS_MOUNT=y
           CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
           CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
           CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
           CONFIG_KSU_SUSFS_SUS_KSTAT=y
           CONFIG_KSU_SUSFS_TRY_UMOUNT=y
           CONFIG_KSU_SUSFS_SPOOF_UNAME=y
           CONFIG_KSU_SUSFS_ENABLE_LOG=y
           CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
           CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
           CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
           CONFIG_KSU_SUSFS_SUS_MAP=y
           CONFIG_KSU_SUSFS_SUS_SU=y
           EOF
    
           echo "✔ Wild-KSU configs with SUSFS added"
    
           # Clean up
           rm -rf susfs4ksu
    
           echo "🎉 Wild-KSU with SUSFS fully integrated and verified!"
    
      - name: "📝 Append custom Makefile line"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
         echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-uninitialized-const-pointer' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-sometimes-uninitialized' >> Makefile
         echo "Custom Makefile line added successfully"

      # ====================== Begin Processing Build Kernel Stage ======================
    
      - name: "🔨 START Build Kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ "${{ github.event.inputs.LTOoptimizations }}" = "thin" ]; then
           LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          else
           LTO=full BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          fi

      # ====================== Begin Packaging the Kernel Stage ======================

      - name: "🧩 Patch Kernel Image (KPM) for SUKISU/RESUKISU"
        if: matrix.variant == 'ksu' && github.event.inputs.KPM == 'on'
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          echo "🔧 Downloading KPM tool..."
          curl -fLO https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
          chmod +x patch_linux
          
          echo "🔧 Patching Kernel..."
          # Note: Ensure patch_linux doesn't require flags like '-i Image'
          ./patch_linux 
          
          if [ -f oImage ]; then
            rm -f Image
            mv oImage Image
            cp Image "$GITHUB_WORKSPACE/AnyKernel3/Image"
            echo "✅ KPM Patch Applied Successfully"
          else
            echo "❌ Error: oImage was not created by the patch tool!"
            exit 1
          fi

      - name: "📦 Prepare artifact"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          VARIANT_NAME="${{ matrix.variant }}";
          if [ "${{ matrix.variant }}" == "ksu" ]; then
            VARIANT_NAME="${{ matrix.variant }}";
          fi
          cp out/dist/Image Image.$VARIANT_NAME
          echo "ARTIFACT_NAME=kernel-${VARIANT_NAME}-${{ github.event.inputs.optimizationLevel }}-${{ github.event.inputs.tickRate }}hz" >> $GITHUB_ENV
          echo "IMAGE_NAME=Image.$VARIANT_NAME" >> $GITHUB_ENV

      - name: 🔍 Check Space (Post-Build)
        if: always()
        run: |
          echo "Final disk space status:"
          df -h /
      
      - name: "♻️ Remove swapfile (cleanup)"
        if: always()
        run: |
 
          if [ -f /swapfile ]; then
            echo "Disabling and removing /swapfile..."
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile || true
   
            sudo sysctl -w vm.swappiness=60 || true
            echo "Swapfile removed."
          else
            echo "No /swapfile found - nothing to cleanup."
          fi

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORK_DIR }}/${{ env.IMAGE_NAME }}
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%d-%m-%Y')
          git clone --depth=1 https://github.com/nebixts/AnyKernel3 -b master AnyKernel3

          find kernels -name "Image.*" -exec cp {} AnyKernel3/ \;
          
          KSU_INFO=""
          if [ "${{ github.event.inputs.buildKSU }}" != "noksu" ]; then
            KSU_INFO="_${{ github.event.inputs.ksuVariant }}"
          fi
          ZIP_NAME="nefarian_cl22_${{ github.event.inputs.kernelBranch }}${KSU_INFO}_${{ github.event.inputs.optimizationLevel }}_${{ github.event.inputs.tickRate }}hz_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
          
