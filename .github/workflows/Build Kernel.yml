name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: KSU variant
        required: true
        type: choice
        default: SukiSU-Ultra
        options:
          - Vanilla
          - KernelSU
          - KernelSU-Next
          - ReSukiSU
          - SukiSU-Ultra
      kernelSourceURL:
        description: Kernel source URL
        required: true
        type: string
        default: https://github.com/ShiningAsStar/kernel_redmi-5.15
      kernelBranch:
        description: Kernel branch
        required: true
        type: choice
        default: shining
        options:
          - shining
          - shining-oplus
      kernelDevice:
        description: Device defconfig
        required: true
        type: string
        default: gki
      kernelSpoofVersion:
        description: Spoofed kernel version (leave empty for stock)
        required: false
        type: string
        default: ""
      localVersion:
        description: Local version suffix (leave empty for stock)
        required: false
        type: string
        default: ""
      SUSFS:
        description: Enable SuSFS
        required: true
        type: boolean
        default: true
      optimizationLevel:
        description: Optimization level
        required: false
        type: choice
        default: O3
        options:
          - O2
          - O3
          - Os
      clangVersion:
        description: Clang toolchain
        required: true
        type: choice
        default: ZyCromerZ
        options:
          - ZyCromerZ
          - AOSP
      tickRate:
        description: Kernel tick rate
        required: false
        type: choice
        default: "250"
        options:
          - default
          - "100"
          - "250"
          - "300"
          - "500"
          - "1000"
      bbg:
        description: Baseband guard
        required: true
        type: choice
        default: on
        options:
          - on
          - off
      spoofIntegrity:
        description: Integrity spoof
        required: true
        type: choice
        default: off
        options:
          - on
          - off
      LtoOptimizations:
        description: LTO type
        required: true
        type: choice
        default: thin
        options:
          - thin
          - full
      KPM:
        description: Kernel Patch Module
        required: true
        type: choice
        default: off
        options:
          - on
          - off
      droidspaces:
        description: Droidspaces support
        required: true
        type: choice
        default: off
        options:
          - on
          - off
      systemDlkm:
        description: Include system_dlkm in the zip
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.variant }} @ ${{ inputs.kernelBranch }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure ccache dir
        run: mkdir -p .ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ inputs.variant }}-${{ inputs.kernelBranch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.variant }}-${{ inputs.kernelBranch }}-

      - name: Build
        env:
          VARIANT: ${{ inputs.variant }}
          KERNEL_SOURCE_URL: ${{ inputs.kernelSourceURL }}
          KERNEL_BRANCH: ${{ inputs.kernelBranch }}
          KERNEL_DEVICE: ${{ inputs.kernelDevice }}
          KERNEL_SPOOF_VERSION: ${{ inputs.kernelSpoofVersion }}
          LOCAL_VERSION: ${{ inputs.localVersion }}
          ENABLE_SUSFS: ${{ inputs.SUSFS }}
          OPT_LEVEL: ${{ inputs.optimizationLevel }}
          CLANG_VERSION: ${{ inputs.clangVersion }}
          TICK_RATE: ${{ inputs.tickRate }}
          BBG: ${{ inputs.bbg }}
          SPOOF_INTEGRITY: ${{ inputs.spoofIntegrity }}
          LTO_TYPE: ${{ inputs.LtoOptimizations }}
          KPM: ${{ inputs.KPM }}
          DROIDSPACES: ${{ inputs.droidspaces }}
          SYSTEM_DLKM: ${{ inputs.systemDlkm }}
        run: bash configuration/build.sh

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.AK3_DIR }}
          retention-days: 3

      - name: Telegram notify
        if: always()
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_USER_ID }}
          BUILD_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VARIANT: ${{ inputs.variant }}
          KERNEL_BRANCH: ${{ inputs.kernelBranch }}
          CLANG_VERSION: ${{ inputs.clangVersion }}
          LTO_TYPE: ${{ inputs.LtoOptimizations }}
          OPT_LEVEL: ${{ inputs.optimizationLevel }}
          TICK_RATE: ${{ inputs.tickRate }}
          ENABLE_SUSFS: ${{ inputs.SUSFS }}
          BBG: ${{ inputs.bbg }}
          KPM: ${{ inputs.KPM }}
          DROIDSPACES: ${{ inputs.droidspaces }}
          SPOOF_INTEGRITY: ${{ inputs.spoofIntegrity }}
          KSUVER: ${{ env.KSUVER }}
          KERNEL_VERSION: ${{ env.KERNEL_MAKE_VERSION }}
          SPOOFED_VERSION: ${{ inputs.kernelSpoofVersion }}
          LOCAL_VERSION: ${{ inputs.localVersion }}
          ZIP_PATH: ${{ env.ZIP_PATH }}
        run: python3 configuration/notify.py
