name: Build Chagall Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm
          sudo docker image prune -af || true
          sudo docker builder prune -af || true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git make gcc libelf-dev libssl-dev bc flex bison rsync zip curl

      - name: Download Clang
        run: |
          mkdir -p clang
          curl -L --retry 5 -o /tmp/clang.tar.gz "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz"
          tar -C clang -zxf /tmp/clang.tar.gz
          rm /tmp/clang.tar.gz

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch bsp-chagall-w-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource kernel_source

      - name: Build kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          cp kernel_source/arch/arm64/configs/gki_defconfig out/.config
          make -j$(nproc --all) O=out LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc --all) O=out LLVM=1 LLVM_IAS=1 Image

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md
          cd ak3
          curl -fSL "https://github.com/NEESCHAL-3/EVONIX-kernel/releases/download/v2.0/EVONIX-v2.0-RODIN.zip" -o /tmp/ak3-src.zip
          unzip -oq /tmp/ak3-src.zip -d /tmp/ak3-src
          for t in busybox fec httools_static lptools_static magiskboot magiskpolicy snapshotupdater_static; do
            cp /tmp/ak3-src/tools/$t tools/
          done
          chmod +x tools/*
          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Chagall Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=15-16
          '; }
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          no_magisk_check=1;
          . tools/ak3-core.sh;
          if [ -L "/dev/block/bootdevice/by-name/init_boot_a" ] || [ -L "/dev/block/by-name/init_boot_a" ]; then
            split_boot;
            flash_boot;
          else
            dump_boot;
            write_boot;
          fi;
          EOF
          cp ../out/arch/arm64/boot/Image Image
          zip -r9 ../Chagall_Kernel.zip * -x .git

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Chagall_Kernel
          path: ak3/*
          retention-days: 7