name: Build Chagall Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git curl wget zip unzip bc bison flex libssl-dev make python3
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "~/bin" >> $GITHUB_PATH
          git config --global user.name "ci"
          git config --global user.email "ci@local"

      - name: Sync AOSP kernel tree
        run: |
          mkdir -p ws && cd ws
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6 -m default.xml
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle --fail-fast
          echo "AOSP tree synced"

      - name: Replace common/ with Chagall kernel source
        run: |
          rm -rf ws/common
          git clone --depth=1 --branch bsp-chagall-w-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource ws/common
          echo "Chagall kernel source placed"

      - name: Build kernel with Bazel
        run: |
          cd ws
          tools/bazel build --lto=thin //common:kernel_aarch64_dist
          mkdir -p dist
          IMG=$(find -L bazel-bin -name Image -path '*kernel_aarch64*' | head -1)
          test -n "$IMG"
          cp -v "$IMG" dist/Image
          strings dist/Image | grep "^Linux version" | head -1

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md
          cd ak3
          curl -fSL "https://github.com/NEESCHAL-3/EVONIX-kernel/releases/download/v2.0/EVONIX-v2.0-RODIN.zip" -o /tmp/ak3-src.zip
          unzip -oq /tmp/ak3-src.zip -d /tmp/ak3-src
          for t in busybox fec httools_static lptools_static magiskboot magiskpolicy snapshotupdater_static; do
            cp /tmp/ak3-src/tools/$t tools/
          done
          chmod +x tools/*
          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Chagall Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=15-16
          '; }
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          no_magisk_check=1;
          . tools/ak3-core.sh;
          if [ -L "/dev/block/bootdevice/by-name/init_boot_a" ] || [ -L "/dev/block/by-name/init_boot_a" ]; then
            split_boot;
            flash_boot;
          else
            dump_boot;
            write_boot;
          fi;
          EOF
          cp ../ws/dist/Image Image
          zip -r9 ../Chagall_Kernel.zip * -x .git

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Chagall_Kernel
          path: ak3/*
          retention-days: 7